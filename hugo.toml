baseURL = "https://geric.github.io/"
locale = "en-us"
title = "Geric Encarnacion"
theme = "PaperMod"
publishDir = "docs"

enableRobotsTXT = true
enableEmojify = false
pygmentsUseClasses = true

[minify]
  disableXML = true

[params]
  env = "production"
  description = "Geric Encarnacion — Technology Lead. Backend architecture, engineering strategy, and RWA tokenization."
  author = "Geric Encarnacion"
  defaultTheme = "auto"
  disableThemeToggle = false
  ShowShareButtons = false
  ShowReadingTime = true
  displayFullLangName = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = false
  ShowRssButtonInSectionTermList = true
  ShowToc = false

  [params.homeInfoParams]
    Title = "Hi, I'm Geric \U0001F44B"
    Content = "Technology Lead — backend architecture, engineering strategy, and RWA tokenization. 12+ years across fintech, govtech, and DeFi."

  [[params.socialIcons]]
    name = "email"
    url = "mailto:grencarnacion@gmail.com"

  [[params.socialIcons]]
    name = "linkedin"
    url = "https://www.linkedin.com/in/geric-encarnacion/"

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/geric"

[outputs]
  home = ["HTML", "RSS", "JSON"]

[[menu.main]]
  identifier = "about"
  name = "About"
  url = "/about/"
  weight = 10

[[menu.main]]
  identifier = "portfolio"
  name = "Portfolio"
  url = "/portfolio/"
  weight = 20

[[menu.main]]
  identifier = "posts"
  name = "Blog"
  url = "/posts/"
  weight = 30

[[menu.main]]
  identifier = "contact"
  name = "Contact"
  url = "/contact/"
  weight = 40

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 50

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
